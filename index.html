<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumen Translate</title>
  <meta name="description" content="Lumen Translate — быстрый и красивый онлайн-переводчик">

  <!-- Шрифт Manrope с Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       ПЕРЕМЕННЫЕ ТЕМЫ
       ========================================================= */
    :root {
      --bg-1: #6d28d9;            /* фиолетовый */
      --bg-2: #2563eb;            /* синий */
      --bg-3: #14b8a6;            /* бирюзовый */
      --text: #14122b;
      --text-soft: #4b4870;
      --glass: rgba(255, 255, 255, 0.55);
      --glass-strong: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(255, 255, 255, 0.7);
      --shadow: 0 20px 50px -15px rgba(30, 20, 80, 0.35);
      --accent: #6d28d9;
      --accent-glow: rgba(124, 58, 237, 0.45);
      --danger: #dc2626;
      --field-bg: rgba(255, 255, 255, 0.45);
      --radius: 24px;
      color-scheme: light;
    }

    /* Тёмная тема */
    :root[data-theme="dark"] {
      --bg-1: #2e1065;
      --bg-2: #1e3a8a;
      --bg-3: #115e59;
      --text: #f1f0ff;
      --text-soft: #b6b3d9;
      --glass: rgba(20, 18, 45, 0.5);
      --glass-strong: rgba(30, 27, 64, 0.85);
      --glass-border: rgba(255, 255, 255, 0.14);
      --shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.6);
      --accent: #a78bfa;
      --accent-glow: rgba(167, 139, 250, 0.45);
      --danger: #f87171;
      --field-bg: rgba(10, 8, 30, 0.35);
      color-scheme: dark;
    }

    /* =========================================================
       БАЗА
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: "Manrope", "Inter", system-ui, sans-serif;
      font-size: 18px;
      line-height: 1.6;
      color: var(--text);
      /* Переливающийся градиентный фон */
      background: linear-gradient(120deg, var(--bg-1), var(--bg-2), var(--bg-3), var(--bg-2), var(--bg-1));
      background-size: 400% 400%;
      animation: gradientShift 20s ease infinite;
      transition: color 0.4s ease;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* =========================================================
       СВЕТЯЩИЕСЯ «ПЯТНА» НА ФОНЕ
       ========================================================= */
    .blobs {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.55;
      will-change: transform;
    }

    .blob-1 { width: 380px; height: 380px; background: #c084fc; top: -80px;  left: -60px;  animation: float1 22s ease-in-out infinite; }
    .blob-2 { width: 320px; height: 320px; background: #60a5fa; top: 40%;    right: -80px; animation: float2 26s ease-in-out infinite; }
    .blob-3 { width: 300px; height: 300px; background: #2dd4bf; bottom: -90px; left: 25%;  animation: float3 24s ease-in-out infinite; }
    .blob-4 { width: 220px; height: 220px; background: #f0abfc; top: 20%;    left: 45%;    animation: float4 30s ease-in-out infinite; }

    @keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(120px, 90px) scale(1.15); } }
    @keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-140px, -60px) scale(0.9); } }
    @keyframes float3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(90px, -120px) scale(1.1); } }
    @keyframes float4 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-80px, 110px) scale(1.2); } }

    /* =========================================================
       РАЗМЕТКА СТРАНИЦЫ
       ========================================================= */
    .page {
      position: relative;
      z-index: 1;
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 24px 48px;
    }

    /* Шапка */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 36px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
    }

    .logo-mark {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 22px;
    }

    .header-actions { display: flex; gap: 10px; }

    .hero {
      text-align: center;
      color: #fff;
      margin-bottom: 32px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: clamp(30px, 5vw, 52px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.25);
    }

    .hero p {
      margin: 0;
      font-size: clamp(16px, 2vw, 19px);
      opacity: 0.88;
    }

    /* Основная сетка: поля рядом, кнопка смены посередине */
    .translator {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 20px;
      align-items: stretch;
    }

    /* =========================================================
       СТЕКЛЯННЫЕ КАРТОЧКИ
       ========================================================= */
    .card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 20px;
      border-radius: var(--radius);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    /* Выпадающий список языков */
    .select-wrap {
      position: relative;
      flex: 1;
    }

    .select-wrap::after {
      content: "";
      position: absolute;
      right: 18px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--text-soft);
      border-bottom: 2px solid var(--text-soft);
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
    }

    select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      font: inherit;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      padding: 12px 44px 12px 16px;
      min-height: 50px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: var(--field-bg);
      cursor: pointer;
      transition: box-shadow 0.25s ease;
    }

    select:focus-visible,
    textarea:focus-visible,
    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    select option {
      color: #14122b;
      background: #fff;
    }

    /* Текстовые поля */
    .field {
      position: relative;
      flex: 1;
      display: flex;
    }

    textarea, .output {
      width: 100%;
      min-height: 260px;
      font: inherit;
      font-size: 21px;
      font-weight: 500;
      line-height: 1.55;
      color: var(--text);
      padding: 18px;
      border-radius: 18px;
      border: 1px solid var(--glass-border);
      background: var(--field-bg);
      resize: vertical;
      transition: box-shadow 0.25s ease;
    }

    textarea::placeholder { color: var(--text-soft); opacity: 0.8; }

    .output {
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      overflow-y: auto;
      max-height: 480px;
    }

    .output .placeholder { color: var(--text-soft); opacity: 0.8; }

    /* Эффект плавного проявления перевода */
    .output .fade-in {
      display: inline-block;
      animation: revealText 0.55s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes revealText {
      from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
      to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
    }

    /* Аккуратное сообщение об ошибке */
    .error-msg {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 17px;
      color: var(--danger);
      animation: revealText 0.4s ease both;
    }

    /* Индикатор загрузки из трёх точек */
    .loader {
      position: absolute;
      right: 18px;
      bottom: 18px;
      display: none;
      gap: 6px;
    }

    .loader.active { display: flex; }

    .loader span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
      animation: dotPulse 1.2s ease-in-out infinite;
    }

    .loader span:nth-child(2) { animation-delay: 0.15s; }
    .loader span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%           { transform: scale(1.1); opacity: 1; }
    }

    /* Нижняя панель карточки */
    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .counter {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-soft);
      font-variant-numeric: tabular-nums;
      transition: color 0.2s ease;
    }

    .counter.warn  { color: #d97706; }
    .counter.limit { color: var(--danger); }

    .tools { display: flex; gap: 8px; flex-wrap: wrap; }

    /* =========================================================
       КНОПКИ
       ========================================================= */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      min-width: 48px;
      padding: 0 16px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: var(--glass-strong);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.25s cubic-bezier(.34,1.56,.64,1),
                  box-shadow 0.25s ease,
                  background 0.3s ease;
    }

    .btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    /* Наведение: лёгкое увеличение и свечение */
    .btn:hover {
      transform: scale(1.06);
      box-shadow: 0 0 0 1px var(--glass-border), 0 8px 28px var(--accent-glow);
    }

    /* Нажатие: «пружина» */
    .btn:active {
      transform: scale(0.92);
      transition-duration: 0.08s;
    }

    .btn.icon-only { padding: 0; width: 48px; }

    .btn.speaking {
      background: var(--accent);
      color: #fff;
    }

    /* Главная кнопка «Перевести» */
    .btn-primary {
      min-height: 58px;
      padding: 0 40px;
      font-size: 18px;
      color: #fff;
      border: none;
      background: linear-gradient(135deg, #7c3aed, #2563eb 60%, #0d9488);
      box-shadow: 0 10px 30px -8px rgba(76, 29, 149, 0.6);
    }

    .btn-primary:hover {
      box-shadow: 0 14px 40px -6px rgba(124, 58, 237, 0.75);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: progress;
    }

    /* Кнопка смены языков */
    .swap-col {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .swap-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      font-size: 26px;
      padding: 0;
      background: var(--glass-strong);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
    }

    .swap-icon {
      display: inline-block;
      line-height: 1;
      transition: transform 0.5s cubic-bezier(.34,1.56,.64,1);
    }

    .actions-row {
      display: flex;
      justify-content: center;
      margin-top: 28px;
    }

    /* =========================================================
       БОКОВАЯ ПАНЕЛЬ ИСТОРИИ
       ========================================================= */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(10, 8, 30, 0.4);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .overlay.open { opacity: 1; visibility: visible; }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 30;
      width: min(400px, 100%);
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 24px;
      background: var(--glass-strong);
      border-left: 1px solid var(--glass-border);
      box-shadow: -20px 0 60px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
      transform: translateX(105%);
      visibility: hidden;
      transition: transform 0.45s cubic-bezier(.2,.8,.2,1), visibility 0.45s;
    }

    .drawer.open { transform: translateX(0); visibility: visible; }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .drawer-head h2 { margin: 0; font-size: 24px; font-weight: 800; }

    .history-list {
      list-style: none;
      margin: 0;
      padding: 0;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      width: 100%;
      text-align: left;
      font: inherit;
      color: var(--text);
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      background: var(--field-bg);
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.25s ease;
    }

    .history-item:hover {
      transform: translateX(-4px) scale(1.01);
      box-shadow: 0 6px 22px var(--accent-glow);
    }

    .history-item:active { transform: scale(0.97); }

    .history-langs {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .history-src, .history-dst {
      font-size: 15px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-dst { color: var(--text-soft); }

    .history-empty {
      color: var(--text-soft);
      text-align: center;
      margin-top: 40px;
    }

    .drawer-foot { margin-top: 16px; }
    .drawer-foot .btn { width: 100%; }

    /* =========================================================
       ВСПЛЫВАЮЩЕЕ УВЕДОМЛЕНИЕ (TOAST)
       ========================================================= */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      z-index: 40;
      padding: 14px 24px;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
      border-radius: 999px;
      background: rgba(20, 18, 45, 0.85);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 20px) scale(0.95);
      transition: opacity 0.3s ease, transform 0.35s cubic-bezier(.34,1.56,.64,1);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    /* =========================================================
       ПОЯВЛЕНИЕ ЭЛЕМЕНТОВ ПРИ ЗАГРУЗКЕ (поочерёдно)
       ========================================================= */
    .reveal {
      opacity: 0;
      animation: appear 0.8s cubic-bezier(.2,.8,.2,1) forwards;
      animation-delay: calc(var(--i, 0) * 0.12s + 0.1s);
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* =========================================================
       АДАПТИВНОСТЬ
       ========================================================= */
    @media (max-width: 860px) {
      .translator {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      /* Кнопка смены языков между полями; иконка повёрнута вертикально */
      .swap-btn .swap-icon-wrap { display: inline-block; transform: rotate(90deg); }

      textarea, .output { min-height: 180px; font-size: 19px; }
    }

    @media (max-width: 520px) {
      body { font-size: 16px; }
      .page { padding: 18px 16px 36px; }
      .header { margin-bottom: 24px; }
      .logo { font-size: 21px; }
      .logo-mark { width: 40px; height: 40px; }
      .card { padding: 14px; }
      .btn .label { display: none; }       /* на узких экранах — только иконки */
      .btn { padding: 0 14px; }
      .btn-primary { width: 100%; }
      .btn-primary .label { display: inline; }
    }

    /* =========================================================
       УМЕНЬШЕНИЕ ДВИЖЕНИЯ: отключаем анимации
       ========================================================= */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        animation-delay: 0ms !important;
        transition-duration: 0.001ms !important;
      }
      body { animation: none; }
      .blob { animation: none; }
      .reveal { opacity: 1; }
      .btn:hover, .history-item:hover { transform: none; }
    }
  </style>
</head>
<body>

  <!-- Плавающие светящиеся пятна -->
  <div class="blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <div class="page">

    <!-- Шапка -->
    <header class="header reveal" style="--i:0">
      <div class="logo">
        <span class="logo-mark" aria-hidden="true">✦</span>
        Lumen Translate
      </div>
      <div class="header-actions">
        <button class="btn" id="historyBtn" type="button" aria-label="История переводов" aria-controls="drawer" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
          <span class="label">История</span>
        </button>
        <button class="btn icon-only" id="themeBtn" type="button" aria-label="Переключить тему">
          <span id="themeIcon" aria-hidden="true">🌙</span>
        </button>
      </div>
    </header>

    <section class="hero reveal" style="--i:1">
      <h1>Переводите легко и красиво</h1>
      <p>Начните печатать — перевод появится сам</p>
    </section>

    <main class="translator">

      <!-- Левая карточка: исходный текст -->
      <section class="card reveal" style="--i:2" aria-label="Исходный текст">
        <div class="card-top">
          <label class="select-wrap">
            <span class="visually-hidden">Язык исходного текста</span>
            <select id="srcLang"></select>
          </label>
        </div>

        <div class="field">
          <textarea id="srcText" maxlength="500" placeholder="Введите текст…" aria-label="Текст для перевода"></textarea>
        </div>

        <div class="card-bottom">
          <span class="counter" id="counter" aria-live="polite">0 / 500</span>
          <div class="tools">
            <button class="btn" id="speakSrc" type="button" aria-label="Озвучить исходный текст">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
              <span class="label">Озвучить</span>
            </button>
            <button class="btn" id="copySrc" type="button" aria-label="Копировать исходный текст">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span class="label">Копировать</span>
            </button>
            <button class="btn" id="clearBtn" type="button" aria-label="Очистить">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              <span class="label">Очистить</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Кнопка смены языков -->
      <div class="swap-col reveal" style="--i:3">
        <button class="btn swap-btn" id="swapBtn" type="button" aria-label="Поменять языки местами">
          <span class="swap-icon-wrap"><span class="swap-icon" id="swapIcon">⇄</span></span>
        </button>
      </div>

      <!-- Правая карточка: перевод -->
      <section class="card reveal" style="--i:4" aria-label="Перевод">
        <div class="card-top">
          <label class="select-wrap">
            <span class="visually-hidden">Язык перевода</span>
            <select id="dstLang"></select>
          </label>
        </div>

        <div class="field">
          <div class="output" id="output" aria-live="polite" role="status">
            <span class="placeholder">Здесь появится перевод</span>
          </div>
          <div class="loader" id="loader" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>

        <div class="card-bottom">
          <span class="counter" id="dstInfo"></span>
          <div class="tools">
            <button class="btn" id="speakDst" type="button" aria-label="Озвучить перевод">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
              <span class="label">Озвучить</span>
            </button>
            <button class="btn" id="copyDst" type="button" aria-label="Копировать перевод">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span class="label">Копировать</span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <div class="actions-row reveal" style="--i:5">
      <button class="btn btn-primary" id="translateBtn" type="button">
        <span class="label">Перевести</span>
      </button>
    </div>
  </div>

  <!-- Боковая панель истории -->
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-label="История переводов" aria-hidden="true">
    <div class="drawer-head">
      <h2>История</h2>
      <button class="btn icon-only" id="closeDrawer" type="button" aria-label="Закрыть историю">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <ul class="history-list" id="historyList"></ul>
    <div class="drawer-foot">
      <button class="btn" id="clearHistory" type="button">Очистить историю</button>
    </div>
  </aside>

  <!-- Всплывающее уведомление -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    /* =========================================================
       НАСТРОЙКИ
       ========================================================= */
    const MAX_CHARS = 500;          // лимит символов
    const DEBOUNCE_MS = 600;        // задержка автоперевода
    const HISTORY_LIMIT = 10;       // сколько переводов хранить
    const HISTORY_KEY = "lumen-history";
    const THEME_KEY = "lumen-theme";

    // Языки: код для MyMemory, название и код для озвучки
    const LANGUAGES = [
      { code: "ru",    name: "Русский",     voice: "ru-RU" },
      { code: "en",    name: "Английский",  voice: "en-US" },
      { code: "es",    name: "Испанский",   voice: "es-ES" },
      { code: "de",    name: "Немецкий",    voice: "de-DE" },
      { code: "fr",    name: "Французский", voice: "fr-FR" },
      { code: "it",    name: "Итальянский", voice: "it-IT" },
      { code: "zh-CN", name: "Китайский",   voice: "zh-CN" },
      { code: "ja",    name: "Японский",    voice: "ja-JP" },
      { code: "tr",    name: "Турецкий",    voice: "tr-TR" },
      { code: "uk",    name: "Украинский",  voice: "uk-UA" }
    ];

    /* =========================================================
       ЭЛЕМЕНТЫ СТРАНИЦЫ
       ========================================================= */
    const $ = (id) => document.getElementById(id);
    const srcLang = $("srcLang");
    const dstLang = $("dstLang");
    const srcText = $("srcText");
    const output = $("output");
    const loader = $("loader");
    const counter = $("counter");
    const dstInfo = $("dstInfo");
    const translateBtn = $("translateBtn");
    const swapBtn = $("swapBtn");
    const swapIcon = $("swapIcon");
    const toast = $("toast");
    const drawer = $("drawer");
    const overlay = $("overlay");
    const historyBtn = $("historyBtn");
    const historyList = $("historyList");

    // Текущее состояние
    let translatedText = "";        // последний успешный перевод
    let debounceTimer = null;
    let requestId = 0;              // защита от «устаревших» ответов
    let controller = null;          // для отмены прошлого запроса
    let swapRotation = 0;

    /* =========================================================
       БЕЗОПАСНАЯ РАБОТА С localStorage
       ========================================================= */
    function storageGet(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }

    function storageSet(key, value) {
      try { localStorage.setItem(key, value); } catch (e) { /* хранилище недоступно — молча продолжаем */ }
    }

    /* =========================================================
       ЗАПОЛНЕНИЕ СПИСКОВ ЯЗЫКОВ
       ========================================================= */
    function fillSelect(select, selected) {
      LANGUAGES.forEach((lang) => {
        const opt = document.createElement("option");
        opt.value = lang.code;
        opt.textContent = lang.name;
        if (lang.code === selected) opt.selected = true;
        select.appendChild(opt);
      });
    }

    fillSelect(srcLang, "ru");
    fillSelect(dstLang, "en");

    const langName = (code) => (LANGUAGES.find((l) => l.code === code) || {}).name || code;
    const langVoice = (code) => (LANGUAGES.find((l) => l.code === code) || {}).voice || code;

    /* =========================================================
       ОТОБРАЖЕНИЕ РЕЗУЛЬТАТА
       ========================================================= */
    function showPlaceholder() {
      translatedText = "";
      output.innerHTML = '<span class="placeholder">Здесь появится перевод</span>';
      dstInfo.textContent = "";
    }

    // Показать перевод с эффектом проявления
    function showTranslation(text) {
      translatedText = text;
      output.innerHTML = "";
      const span = document.createElement("span");
      span.className = "fade-in";
      span.textContent = text;     // textContent — защита от вставки HTML
      output.appendChild(span);
      dstInfo.textContent = text.length + " симв.";
    }

    // Аккуратное сообщение об ошибке
    function showError(message) {
      translatedText = "";
      output.innerHTML = "";
      const box = document.createElement("div");
      box.className = "error-msg";
      box.innerHTML = '<span aria-hidden="true">⚠️</span>';
      const text = document.createElement("span");
      text.textContent = message;
      box.appendChild(text);
      output.appendChild(box);
      dstInfo.textContent = "";
    }

    function setLoading(isLoading) {
      loader.classList.toggle("active", isLoading);
      translateBtn.disabled = isLoading;
    }

    /* =========================================================
       ПЕРЕВОД ЧЕРЕЗ MyMemory
       ========================================================= */
    async function translate() {
      clearTimeout(debounceTimer);
      const text = srcText.value.trim();

      // Пустое поле — просто очищаем результат
      if (!text) {
        if (controller) controller.abort();
        setLoading(false);
        showPlaceholder();
        return;
      }

      // Одинаковые языки — переводить нечего
      if (srcLang.value === dstLang.value) {
        showTranslation(text);
        return;
      }

      // Отменяем предыдущий запрос, если он ещё идёт
      if (controller) controller.abort();
      controller = new AbortController();
      const myId = ++requestId;
      const pair = srcLang.value + "|" + dstLang.value;
      const url = "https://api.mymemory.translated.net/get?q=" +
                  encodeURIComponent(text) + "&langpair=" + encodeURIComponent(pair);

      // Ограничиваем ожидание ответа 10 секундами
      const timeout = setTimeout(() => controller.abort(), 10000);
      const currentController = controller;

      setLoading(true);

      try {
        const response = await fetch(url, { signal: currentController.signal });
        if (!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();
        if (myId !== requestId) return;   // пришёл ответ на старый запрос

        const status = Number(data && data.responseStatus);
        const result = data && data.responseData && data.responseData.translatedText;

        if (status !== 200 || !result) {
          // У MyMemory есть дневной лимит — сообщим об этом понятно
          if (status === 429 || /LIMIT/i.test(String(result))) {
            showError("Достигнут дневной лимит бесплатных переводов. Попробуйте позже.");
          } else {
            showError("Не удалось получить перевод. Попробуйте ещё раз чуть позже.");
          }
          return;
        }

        const clean = decodeEntities(result);
        showTranslation(clean);
        addToHistory(text, clean, srcLang.value, dstLang.value);
      } catch (err) {
        if (myId !== requestId) return;   // запрос был заменён новым
        if (err.name === "AbortError") {
          showError("Сервер перевода не отвечает. Проверьте интернет и попробуйте снова.");
        } else {
          showError("Сервис перевода сейчас недоступен. Проверьте подключение к интернету.");
        }
      } finally {
        clearTimeout(timeout);
        if (myId === requestId) setLoading(false);
      }
    }

    // MyMemory иногда возвращает HTML-сущности (&#39; и т.п.) — декодируем
    function decodeEntities(str) {
      const txt = document.createElement("textarea");
      txt.innerHTML = str;
      return txt.value;
    }

    // Автоперевод с задержкой (debounce)
    function scheduleTranslate() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(translate, DEBOUNCE_MS);
    }

    /* =========================================================
       СЧЁТЧИК СИМВОЛОВ
       ========================================================= */
    function updateCounter() {
      const len = srcText.value.length;
      counter.textContent = len + " / " + MAX_CHARS;
      counter.classList.toggle("warn", len >= MAX_CHARS * 0.9 && len < MAX_CHARS);
      counter.classList.toggle("limit", len >= MAX_CHARS);
    }

    srcText.addEventListener("input", () => {
      // Подстраховка на случай вставки текста длиннее лимита
      if (srcText.value.length > MAX_CHARS) {
        srcText.value = srcText.value.slice(0, MAX_CHARS);
      }
      updateCounter();
      scheduleTranslate();
    });

    // Ctrl/Cmd + Enter — мгновенный перевод
    srcText.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        translate();
      }
    });

    translateBtn.addEventListener("click", translate);
    srcLang.addEventListener("change", translate);
    dstLang.addEventListener("change", translate);

    /* =========================================================
       СМЕНА ЯЗЫКОВ МЕСТАМИ
       ========================================================= */
    swapBtn.addEventListener("click", () => {
      // Поворот иконки на 180° (каждый раз дальше по кругу)
      swapRotation += 180;
      swapIcon.style.transform = "rotate(" + swapRotation + "deg)";

      // Меняем языки
      const tmpLang = srcLang.value;
      srcLang.value = dstLang.value;
      dstLang.value = tmpLang;

      // Меняем тексты: перевод становится исходником
      const oldSrc = srcText.value;
      if (translatedText) {
        srcText.value = translatedText.slice(0, MAX_CHARS);
        showTranslation(oldSrc);
      } else {
        srcText.value = "";
        showPlaceholder();
        if (oldSrc.trim()) {
          srcText.value = oldSrc;
          scheduleTranslate();
        }
      }
      updateCounter();
    });

    /* =========================================================
       КОПИРОВАНИЕ, ОЧИСТКА
       ========================================================= */
    let toastTimer = null;
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    async function copyText(text) {
      if (!text) {
        showToast("Нечего копировать");
        return;
      }
      try {
        // Современный способ (может быть недоступен при открытии через file://)
        await navigator.clipboard.writeText(text);
        showToast("Скопировано");
      } catch (e) {
        // Запасной способ через временное поле
        const tmp = document.createElement("textarea");
        tmp.value = text;
        tmp.style.position = "fixed";
        tmp.style.opacity = "0";
        document.body.appendChild(tmp);
        tmp.select();
        try {
          document.execCommand("copy");
          showToast("Скопировано");
        } catch (err) {
          showToast("Не удалось скопировать");
        }
        document.body.removeChild(tmp);
      }
    }

    $("copySrc").addEventListener("click", () => copyText(srcText.value));
    $("copyDst").addEventListener("click", () => copyText(translatedText));

    $("clearBtn").addEventListener("click", () => {
      clearTimeout(debounceTimer);
      if (controller) controller.abort();
      requestId++;
      setLoading(false);
      srcText.value = "";
      updateCounter();
      showPlaceholder();
      stopSpeaking();
      srcText.focus();
    });

    /* =========================================================
       ОЗВУЧКА (speechSynthesis)
       ========================================================= */
    const speakSrcBtn = $("speakSrc");
    const speakDstBtn = $("speakDst");
    const synth = "speechSynthesis" in window ? window.speechSynthesis : null;

    function stopSpeaking() {
      if (synth) synth.cancel();
      speakSrcBtn.classList.remove("speaking");
      speakDstBtn.classList.remove("speaking");
    }

    function speak(text, langCode, button) {
      if (!synth) {
        showToast("Озвучка не поддерживается браузером");
        return;
      }
      if (!text.trim()) {
        showToast("Нечего озвучивать");
        return;
      }
      // Повторное нажатие на ту же кнопку останавливает речь
      const wasSpeaking = button.classList.contains("speaking");
      stopSpeaking();
      if (wasSpeaking) return;

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = langVoice(langCode);
      // Пробуем подобрать подходящий голос
      const voice = synth.getVoices().find((v) => v.lang.replace("_", "-").toLowerCase().startsWith(langCode.split("-")[0].toLowerCase()));
      if (voice) utter.voice = voice;
      utter.rate = 0.95;
      utter.onend = utter.onerror = () => button.classList.remove("speaking");
      button.classList.add("speaking");
      synth.speak(utter);
    }

    speakSrcBtn.addEventListener("click", () => speak(srcText.value, srcLang.value, speakSrcBtn));
    speakDstBtn.addEventListener("click", () => speak(translatedText, dstLang.value, speakDstBtn));

    // В некоторых браузерах список голосов загружается асинхронно
    if (synth) synth.getVoices();

    /* =========================================================
       ИСТОРИЯ ПЕРЕВОДОВ
       ========================================================= */
    function loadHistory() {
      try {
        const data = JSON.parse(storageGet(HISTORY_KEY) || "[]");
        return Array.isArray(data) ? data : [];
      } catch (e) {
        return [];
      }
    }

    function saveHistory(list) {
      storageSet(HISTORY_KEY, JSON.stringify(list));
    }

    function addToHistory(src, dst, from, to) {
      let list = loadHistory();
      // Убираем дубликат, чтобы запись поднялась наверх
      list = list.filter((item) => !(item.src === src && item.from === from && item.to === to));
      list.unshift({ src, dst, from, to, time: Date.now() });
      saveHistory(list.slice(0, HISTORY_LIMIT));
      renderHistory();
    }

    function renderHistory() {
      const list = loadHistory();
      historyList.innerHTML = "";

      if (!list.length) {
        const empty = document.createElement("li");
        empty.className = "history-empty";
        empty.textContent = "Здесь будут ваши последние переводы";
        historyList.appendChild(empty);
        return;
      }

      list.forEach((item) => {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "history-item";

        const langs = document.createElement("div");
        langs.className = "history-langs";
        langs.textContent = langName(item.from) + " → " + langName(item.to);

        const s = document.createElement("div");
        s.className = "history-src";
        s.textContent = item.src;

        const d = document.createElement("div");
        d.className = "history-dst";
        d.textContent = item.dst;

        btn.append(langs, s, d);

        // Клик по записи возвращает её в поля
        btn.addEventListener("click", () => {
          clearTimeout(debounceTimer);
          requestId++;
          setLoading(false);
          srcLang.value = item.from;
          dstLang.value = item.to;
          srcText.value = item.src;
          updateCounter();
          showTranslation(item.dst);
          closeDrawer();
        });

        li.appendChild(btn);
        historyList.appendChild(li);
      });
    }

    function openDrawer() {
      renderHistory();
      drawer.classList.add("open");
      overlay.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
      historyBtn.setAttribute("aria-expanded", "true");
      $("closeDrawer").focus();
    }

    function closeDrawer() {
      drawer.classList.remove("open");
      overlay.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
      historyBtn.setAttribute("aria-expanded", "false");
    }

    historyBtn.addEventListener("click", openDrawer);
    $("closeDrawer").addEventListener("click", closeDrawer);
    overlay.addEventListener("click", closeDrawer);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && drawer.classList.contains("open")) closeDrawer();
    });

    $("clearHistory").addEventListener("click", () => {
      saveHistory([]);
      renderHistory();
      showToast("История очищена");
    });

    /* =========================================================
       ТЕМА: светлая / тёмная (выбор запоминается)
       ========================================================= */
    const themeIcon = $("themeIcon");

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      themeIcon.textContent = theme === "dark" ? "☀️" : "🌙";
    }

    // Сохранённая тема или системная настройка
    const savedTheme = storageGet(THEME_KEY);
    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    applyTheme(savedTheme === "dark" || savedTheme === "light" ? savedTheme : (prefersDark ? "dark" : "light"));

    $("themeBtn").addEventListener("click", () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      applyTheme(next);
      storageSet(THEME_KEY, next);
    });

    /* =========================================================
       СТАРТ
       ========================================================= */
    updateCounter();
    renderHistory();
  </script>
</body>
</html>

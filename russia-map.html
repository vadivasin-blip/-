<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lumen Atlas</title>
  <meta name="description" content="Интерактивная карта всех городов России">

  <!-- Шрифт Manrope с Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       ПЕРЕМЕННЫЕ ТЕМЫ
       ========================================================= */
    :root {
      /* Светлая тема */
      --bg-0: #eef2ff;
      --bg-1: #e0f2fe;
      --text: #0f172a;
      --text-soft: #475569;
      --glass: rgba(255, 255, 255, 0.62);
      --glass-strong: rgba(255, 255, 255, 0.86);
      --border: rgba(255, 255, 255, 0.85);
      --line: rgba(15, 23, 42, 0.08);
      --shadow: 0 24px 60px -20px rgba(30, 41, 90, 0.35);
      --accent: #0891b2;
      --accent-glow: rgba(8, 145, 178, 0.35);
      --dot: #c2410c;
      --dot-halo: rgba(234, 88, 12, 0.22);
      --region-alpha: 0.34;
      --region-stroke: rgba(255, 255, 255, 0.95);
      --label: #0f172a;
      --label-halo: rgba(255, 255, 255, 0.92);
      --hatch: rgba(71, 85, 105, 0.55);
      --aurora-1: #a5b4fc;
      --aurora-2: #67e8f9;
      --aurora-3: #f9a8d4;
      --stars: 0;
      --spring: cubic-bezier(.34, 1.56, .64, 1);
      --smooth: cubic-bezier(.2, .8, .2, 1);
      --radius: 22px;
      color-scheme: light;
    }

    /* Тёмная тема — «ночные огни городов» */
    :root[data-theme="dark"] {
      --bg-0: #050816;
      --bg-1: #0b1230;
      --text: #f1f5ff;
      --text-soft: #9aa6c7;
      --glass: rgba(15, 20, 48, 0.55);
      --glass-strong: rgba(18, 24, 58, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --line: rgba(255, 255, 255, 0.08);
      --shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.7);
      --accent: #22d3ee;
      --accent-glow: rgba(34, 211, 238, 0.4);
      --dot: #fff3c4;
      --dot-halo: rgba(255, 196, 92, 0.28);
      --region-alpha: 0.2;
      --region-stroke: rgba(255, 255, 255, 0.2);
      --label: #f8fafc;
      --label-halo: rgba(5, 8, 22, 0.88);
      --hatch: rgba(255, 255, 255, 0.4);
      --aurora-1: #6d28d9;
      --aurora-2: #0e7490;
      --aurora-3: #be185d;
      --stars: 1;
      color-scheme: dark;
    }

    /* =========================================================
       БАЗА
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;             /* страница — полноэкранное приложение */
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      font-family: "Manrope", "Inter", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
      background: radial-gradient(ellipse at 30% 10%, var(--bg-1), var(--bg-0) 70%);
      background-color: var(--bg-0);
      transition: color 0.4s ease, background-color 0.4s ease;
    }

    button { font: inherit; color: inherit; }

    /* =========================================================
       ФОН: северное сияние и звёзды
       ========================================================= */
    .sky {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .aurora {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      will-change: transform;
    }

    .aurora-1 { width: 55vw; height: 40vw; background: var(--aurora-1); top: -15vw; left: -10vw; animation: drift1 28s ease-in-out infinite; }
    .aurora-2 { width: 45vw; height: 35vw; background: var(--aurora-2); bottom: -15vw; right: -5vw; animation: drift2 32s ease-in-out infinite; }
    .aurora-3 { width: 30vw; height: 25vw; background: var(--aurora-3); top: 30%; left: 40%; opacity: 0.25; animation: drift3 36s ease-in-out infinite; }

    @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(12vw, 6vw) scale(1.15); } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-14vw, -4vw) scale(0.9); } }
    @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-8vw, 8vw) scale(1.25); } }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #fff;
      opacity: calc(var(--stars) * 0.7);
      animation: twinkle var(--t, 4s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    @keyframes twinkle {
      0%, 100% { opacity: calc(var(--stars) * 0.15); }
      50%      { opacity: calc(var(--stars) * 0.9); }
    }

    /* =========================================================
       ШАПКА
       ========================================================= */
    .topbar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      text-decoration: none;
      color: var(--text);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      font-size: 20px;
      color: #fff;
      background: linear-gradient(135deg, #7c3aed, #0891b2);
      box-shadow: 0 8px 24px -6px var(--accent-glow);
    }

    .logo-text { display: flex; flex-direction: column; line-height: 1.15; text-align: left; }
    .logo-title { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
    .logo-sub { font-size: 13px; font-weight: 600; color: var(--text-soft); }

    /* Поиск */
    .search {
      position: relative;
      flex: 1;
      max-width: 520px;
      margin-left: auto;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      width: 20px;
      height: 20px;
      transform: translateY(-50%);
      color: var(--text-soft);
      pointer-events: none;
      z-index: 1;
    }

    .search input {
      width: 100%;
      min-height: 48px;
      padding: 0 52px 0 46px;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      transition: box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .search input::placeholder { color: var(--text-soft); font-weight: 500; }

    .search input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow), var(--shadow);
    }

    .kbd {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-soft);
      border: 1px solid var(--line);
      border-radius: 7px;
      pointer-events: none;
    }

    .search input:not(:placeholder-shown) ~ .kbd { display: none; }

    .results {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      margin: 0;
      padding: 6px;
      list-style: none;
      max-height: min(420px, 60vh);
      overflow-y: auto;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--glass-strong);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: var(--shadow);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px) scale(0.98);
      transform-origin: top center;
      transition: opacity 0.2s ease, transform 0.25s var(--spring), visibility 0.2s;
    }

    .results.open { opacity: 1; visibility: visible; transform: none; }

    .result {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      min-height: 52px;
      border-radius: 12px;
      cursor: pointer;
    }

    .result[aria-selected="true"], .result:hover { background: var(--line); }

    .result-dot {
      width: 10px;
      height: 10px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--c, var(--dot));
      box-shadow: 0 0 10px var(--c, var(--dot));
    }

    .result-main { flex: 1; min-width: 0; }
    .result-name { font-weight: 700; }
    .result-name mark { background: none; color: var(--accent); }
    .result-meta { font-size: 13px; color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .result-empty { padding: 14px; color: var(--text-soft); text-align: center; }

    /* =========================================================
       КНОПКИ И ЧИПЫ
       ========================================================= */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 48px;
      min-height: 48px;
      padding: 0 14px;
      font-weight: 700;
      border-radius: 15px;
      border: 1px solid var(--border);
      background: var(--glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.25s var(--spring), box-shadow 0.25s ease, background 0.3s ease;
    }

    .btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    .btn:hover {
      transform: scale(1.07);
      box-shadow: 0 0 0 1px var(--border), 0 10px 30px var(--accent-glow);
    }

    .btn:active { transform: scale(0.9); transition-duration: 0.08s; }

    .btn:focus-visible, .chip:focus-visible, .row:focus-visible, .logo:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.25s var(--spring), background 0.3s ease, color 0.3s ease, box-shadow 0.25s ease;
    }

    .chip:hover { transform: translateY(-2px); box-shadow: 0 8px 22px var(--accent-glow); }
    .chip:active { transform: scale(0.94); }

    .chip[aria-pressed="true"] {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, #7c3aed, #0891b2);
      box-shadow: 0 8px 22px -6px var(--accent-glow);
    }

    /* =========================================================
       СЦЕНА С КАРТОЙ
       ========================================================= */
    .stage {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
    }

    .map-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    #map {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;           /* жесты обрабатываем сами */
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }

    #map.dragging { cursor: grabbing; }

    /* --- Регионы --- */
    .region {
      fill: var(--c);
      fill-opacity: var(--region-alpha);
      stroke: var(--region-stroke);
      stroke-width: 0.8px;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      cursor: pointer;
      transform-box: fill-box;
      transform-origin: center;
      animation: regionIn 0.9s var(--smooth) backwards;
      animation-delay: var(--d);
      transition: fill-opacity 0.35s ease, stroke 0.35s ease;
    }

    .region:hover { fill-opacity: calc(var(--region-alpha) + 0.2); }

    .region.disputed {
      fill: url(#hatch);
      fill-opacity: 1;
      stroke-dasharray: 3 3;
    }

    #hatch line { stroke: var(--hatch); stroke-width: 1.2; }

    @keyframes regionIn {
      from { opacity: 0; transform: scale(0.92) translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    /* Режим фокуса: выделенные регионы ярче, остальные приглушены */
    #map.focus .region:not(.active) { fill-opacity: calc(var(--region-alpha) * 0.35); }
    #map.focus .region.active { fill-opacity: calc(var(--region-alpha) + 0.22); stroke: var(--accent); }
    #map.focus .region.disputed:not(.active) { opacity: 0.4; }
    .region.hl { fill-opacity: calc(var(--region-alpha) + 0.14); }

    /* --- Города рисуются на canvas поверх регионов: так масштаб остаётся плавным --- */
    #cityCanvas {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;         /* события получает SVG под ним */
    }

    /* =========================================================
       ЭЛЕМЕНТЫ ПОВЕРХ КАРТЫ
       ========================================================= */
    .filters {
      position: absolute;
      top: 8px;
      left: 20px;
      right: 420px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filters-count {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-soft);
      padding: 0 6px;
    }

    .controls {
      position: absolute;
      left: 20px;
      bottom: 24px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Всплывающая подсказка у курсора */
    .tooltip {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 6;
      min-width: 160px;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--glass-strong);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      pointer-events: none;
      opacity: 0;
      transform: translate(var(--tx, 0), var(--ty, 0)) scale(0.92);
      transition: opacity 0.18s ease, transform 0.25s var(--spring);
    }

    .tooltip.show { opacity: 1; transform: translate(var(--tx, 0), var(--ty, 0)) scale(1); }
    .tooltip-name { font-size: 17px; font-weight: 800; line-height: 1.2; }
    .tooltip-meta { font-size: 13px; color: var(--text-soft); margin-top: 2px; }
    .tooltip-pop { font-size: 14px; font-weight: 700; margin-top: 6px; color: var(--accent); }

    /* Название региона под курсором */
    .region-chip {
      position: absolute;
      left: 50%;
      bottom: 24px;
      z-index: 5;
      padding: 10px 18px;
      font-weight: 700;
      white-space: nowrap;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, 12px);
      transition: opacity 0.25s ease, transform 0.35s var(--spring);
    }

    .region-chip.show { opacity: 1; transform: translate(-50%, 0); }
    .region-chip small { color: var(--text-soft); font-weight: 600; margin-left: 6px; }

    /* =========================================================
       БОКОВАЯ ПАНЕЛЬ
       ========================================================= */
    .panel {
      position: absolute;
      top: 8px;
      right: 20px;
      bottom: 20px;
      z-index: 7;
      width: 380px;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--glass);
      backdrop-filter: blur(26px) saturate(140%);
      -webkit-backdrop-filter: blur(26px) saturate(140%);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform 0.45s var(--smooth);
    }

    .sheet-handle { display: none; }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      scrollbar-width: thin;
    }

    .panel-body.swap > * { animation: slideIn 0.5s var(--smooth) backwards; }
    .panel-body.swap > *:nth-child(2) { animation-delay: 0.05s; }
    .panel-body.swap > *:nth-child(3) { animation-delay: 0.1s; }
    .panel-body.swap > *:nth-child(4) { animation-delay: 0.15s; }
    .panel-body.swap > *:nth-child(5) { animation-delay: 0.2s; }
    .panel-body.swap > *:nth-child(n+6) { animation-delay: 0.25s; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      margin: -6px 0 10px -8px;
      padding: 0 10px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-soft);
      background: none;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .back:hover { color: var(--text); background: var(--line); }

    .eyebrow {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .title {
      margin: 4px 0 4px;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .subtitle { margin: 0; color: var(--text-soft); font-weight: 600; }

    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

    .badge {
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 800;
      border-radius: 999px;
      background: var(--line);
      color: var(--text);
    }

    .badge.accent { background: var(--accent-glow); }
    .badge.warn { background: rgba(245, 158, 11, 0.22); }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 18px 0 6px;
    }

    .stat {
      padding: 14px;
      border-radius: 16px;
      background: var(--line);
      min-width: 0;
    }

    .stat-label { font-size: 12px; font-weight: 700; color: var(--text-soft); }
    .stat-value { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.25; font-variant-numeric: tabular-nums; }
    .stat-note { font-size: 12px; color: var(--text-soft); font-weight: 600; }

    .colon { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0.2; } }

    .section-title {
      margin: 22px 0 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-soft);
    }

    .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }

    /* Строка списка: город, регион или округ */
    .row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 48px;
      padding: 8px 12px;
      text-align: left;
      border: none;
      border-radius: 14px;
      background: transparent;
      cursor: pointer;
      overflow: hidden;
      transition: background 0.2s ease, transform 0.25s var(--spring);
    }

    .row:hover { background: var(--line); transform: translateX(3px); }
    .row:active { transform: scale(0.98); }

    .row-bar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--w);
      border-radius: 14px;
      background: linear-gradient(90deg, var(--accent-glow), transparent);
      opacity: 0.55;
      transform-origin: left;
      animation: grow 1s var(--smooth) backwards;
      animation-delay: calc(var(--n, 0) * 0.04s + 0.15s);
    }

    @keyframes grow { from { transform: scaleX(0); } }

    .row > *:not(.row-bar) { position: relative; }
    .row-rank { width: 22px; font-size: 13px; font-weight: 800; color: var(--text-soft); font-variant-numeric: tabular-nums; }
    .row-main { flex: 1; min-width: 0; }
    .row-name, .row-meta { display: block; }
    .row-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-meta { font-size: 12px; color: var(--text-soft); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-value { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }

    .swatch {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      border-radius: 5px;
      background: var(--c);
      box-shadow: 0 0 12px var(--c);
    }

    .swatch.hatched {
      background: repeating-linear-gradient(45deg, var(--hatch) 0 2px, transparent 2px 5px);
      box-shadow: none;
      border: 1px dashed var(--hatch);
    }

    .note {
      margin-top: 14px;
      padding: 12px 14px;
      font-size: 13px;
      color: var(--text-soft);
      border-radius: 14px;
      border: 1px dashed var(--line);
    }

    .links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    .links .btn { flex: 1; box-shadow: none; text-decoration: none; color: var(--text); font-size: 14px; }

    .hint { font-size: 13px; color: var(--text-soft); margin-top: 18px; }
    .credits { font-size: 12px; color: var(--text-soft); margin-top: 18px; opacity: 0.8; }
    .credits a { color: inherit; }

    /* =========================================================
       ПОЯВЛЕНИЕ ИНТЕРФЕЙСА ПРИ ЗАГРУЗКЕ
       ========================================================= */
    .reveal {
      animation: appear 0.8s var(--smooth) backwards;
      animation-delay: calc(var(--i, 0) * 0.12s + 0.1s);
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: none; }
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* =========================================================
       АДАПТИВНОСТЬ: на телефоне панель — «шторка» снизу
       ========================================================= */
    @media (max-width: 820px) {
      .topbar { flex-wrap: wrap; gap: 10px; padding: 10px 16px; }
      .logo-sub { display: none; }
      .theme-btn { margin-left: auto; }
      .search { order: 3; flex-basis: 100%; max-width: none; }
      .kbd { display: none; }

      .filters {
        left: 0;
        right: 0;
        top: 4px;
        padding: 0 16px 6px;
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .filters::-webkit-scrollbar { display: none; }

      .controls {
        left: auto;
        right: 16px;
        top: 62px;
        bottom: auto;
      }

      .region-chip { display: none; }

      .panel {
        top: auto;
        left: 0;
        right: 0;
        bottom: 0;
        width: auto;
        height: 46%;
        border-radius: var(--radius) var(--radius) 0 0;
        border-bottom: none;
      }

      .panel.reveal { animation: none; }
      .panel.collapsed { transform: translateY(calc(100% - 64px)); }

      .sheet-handle {
        display: grid;
        place-items: center;
        flex-shrink: 0;
        width: 100%;
        height: 30px;
        padding: 0;
        border: none;
        background: none;
        cursor: pointer;
      }

      .sheet-handle span {
        width: 44px;
        height: 5px;
        border-radius: 3px;
        background: var(--text-soft);
        opacity: 0.5;
      }

      .panel-body { padding: 4px 16px 20px; }
      .title { font-size: 26px; }
      .stat-value { font-size: 19px; }
    }

    /* =========================================================
       УМЕНЬШЕНИЕ ДВИЖЕНИЯ: отключаем анимации
       ========================================================= */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        animation-delay: 0ms !important;
        transition-duration: 0.001ms !important;
      }
      .aurora, .star { animation: none !important; }
    }
  </style>

  <script>
    "use strict";

    /* =========================================================
       ПОДГОТОВКА ДАННЫХ
       ========================================================= */
    const { W, H } = ATLAS;

    // Цвета федеральных округов (в том же порядке, что и ATLAS.districts)
    const COLORS = ["#a78bfa", "#60a5fa", "#fbbf24", "#fb7185", "#34d399", "#22d3ee", "#818cf8", "#f472b6"];

    const REGIONS = ATLAS.regions.map(([name, fd, bbox, disputed, d], i) => ({
      i, name, fd, bbox, d, disputed: !!disputed, cities: [], pop: 0, el: null
    }));

    // Города отсортированы по убыванию населения, поэтому индекс + 1 — место в рейтинге
    const CITIES = ATLAS.cities.map(([name, ri, pop, year, tz, lat, lon, x, y, cap], i) => ({
      i, rank: i + 1, name, region: REGIONS[ri], pop, year, tz, lat, lon, x, y,
      capital: !!cap, r: 1.3 + Math.sqrt(pop / 1e6) * 2.6,
      key: normalize(name), labeled: false, labelT: 0
    }));

    CITIES.forEach((c) => { c.region.cities.push(c); c.region.pop += c.pop; });
    REGIONS.forEach((r) => { r.key = normalize(r.name); });

    const DISTRICTS = ATLAS.districts.map((name, i) => {
      const regions = REGIONS.filter((r) => r.fd === i && !r.disputed);
      const cities = regions.flatMap((r) => r.cities).sort((a, b) => b.pop - a.pop);
      return { i, name, color: COLORS[i], regions, cities, pop: sum(cities, "pop"), bbox: unionBox(regions.map((r) => r.bbox)) };
    });

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* =========================================================
       ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
       ========================================================= */
    function $(sel) { return document.querySelector(sel); }
    function normalize(s) { return s.toLowerCase().replace(/ё/g, "е").trim(); }
    function sum(list, field) { return list.reduce((s, x) => s + x[field], 0); }
    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function fmt(n) { return Math.round(n).toLocaleString("ru-RU"); }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }

    function unionBox(boxes) {
      return boxes.reduce((b, x) => [Math.min(b[0], x[0]), Math.min(b[1], x[1]), Math.max(b[2], x[2]), Math.max(b[3], x[3])], [Infinity, Infinity, -Infinity, -Infinity]);
    }

    // Склонение: plural(5, ["город", "города", "городов"]) → «городов»
    function plural(n, forms) {
      const n10 = n % 10, n100 = n % 100;
      if (n10 === 1 && n100 !== 11) return forms[0];
      if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return forms[1];
      return forms[2];
    }

    // Краткая запись населения: 1,2 млн / 350 тыс.
    function shortPop(n) {
      if (n >= 1e6) return (n / 1e6).toLocaleString("ru-RU", { maximumFractionDigits: 1 }) + " млн";
      if (n >= 1e4) return Math.round(n / 1e3) + " тыс.";
      return fmt(n);
    }

    function yearText(y) { return y < 0 ? -y + " г. до н. э." : y + " г."; }

    // Расстояние между точками по поверхности Земли, км
    function distanceKm(a, b) {
      const R = 6371, rad = Math.PI / 180;
      const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }

    function storageGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
    function storageSet(key, v) { try { localStorage.setItem(key, v); } catch (e) { /* хранилище недоступно */ } }

    /* =========================================================
       ФОН: звёзды
       ========================================================= */
    (function makeStars() {
      const sky = $("#sky");
      const frag = document.createDocumentFragment();
      for (let i = 0; i < 70; i++) {
        const s = document.createElement("span");
        s.className = "star";
        s.style.left = Math.random() * 100 + "%";
        s.style.top = Math.random() * 100 + "%";
        s.style.setProperty("--t", 3 + Math.random() * 4 + "s");
        s.style.setProperty("--delay", -Math.random() * 6 + "s");
        if (Math.random() > 0.8) { s.style.width = s.style.height = "3px"; }
        frag.appendChild(s);
      }
      sky.appendChild(frag);
    })();

    /* =========================================================
       ОТРИСОВКА КАРТЫ
       ========================================================= */
    const svg = $("#map");
    const viewport = $("#viewport");
    const regionLayer = $("#regions");
    const canvas = $("#cityCanvas");
    const ctx = canvas.getContext("2d");
    const hatch = $("#hatch");
    const mapWrap = $("#mapWrap");
    const panel = $("#panel");

    // Регионы: проявляются волной с запада на восток
    regionLayer.innerHTML = REGIONS.map((r) => {
      const delay = 0.15 + ((r.bbox[0] + r.bbox[2]) / 2 / W) * 1.1;
      return `<path class="region${r.disputed ? " disputed" : ""}" data-r="${r.i}" d="${r.d}" style="--c:${COLORS[r.fd]};--d:${delay.toFixed(2)}s"></path>`;
    }).join("");
    REGIONS.forEach((r, i) => { r.el = regionLayer.children[i]; });

    // Города рисуем на canvas: мелкие первыми, чтобы крупные были сверху.
    // Появляются по очереди — от самых крупных к самым маленьким.
    const DRAW_ORDER = CITIES.slice().reverse();
    CITIES.forEach((c) => {
      c.delay = reduceMotion ? 0 : (1 + (c.rank / CITIES.length) * 1.4) * 1000;
      c.alpha = 1;
    });

    /* =========================================================
       МАСШТАБ И ПЕРЕМЕЩЕНИЕ (без библиотек)
       view: k — масштаб, x/y — сдвиг в пикселях экрана
       ========================================================= */
    let cw = 0, ch = 0;            // размер области карты
    let homeK = 1;                 // масштаб «вся Россия»
    let view = { k: 1, x: 0, y: 0 };
    let anim = null;               // текущая анимация перелёта
    let dpr = 1;                   // плотность пикселей экрана
    let dirty = true;              // canvas нужно перерисовать

    function isMobile() { return window.innerWidth <= 820; }

    // Отступы, которые занимает панель, — карта центрируется в оставшейся части
    function insets() {
      const pad = { l: 24, r: 24, t: 64, b: 24 };
      if (isMobile()) {
        pad.t = 60;
        pad.b = panel.classList.contains("collapsed") ? 80 : panel.offsetHeight + 16;
      } else {
        pad.l = 90;
        pad.r = panel.offsetWidth + 44;
      }
      return pad;
    }

    // Вид, в котором прямоугольник карты [x0, y0, x1, y1] целиком помещается на экране
    function fitBox(box, maxK) {
      const p = insets();
      const w = Math.max(box[2] - box[0], 1), h = Math.max(box[3] - box[1], 1);
      const k = clamp(Math.min((cw - p.l - p.r) / w, (ch - p.t - p.b) / h), homeK * 0.6, maxK || homeK * 60);
      return centerOn((box[0] + box[2]) / 2, (box[1] + box[3]) / 2, k);
    }

    // Вид, где точка карты (mx, my) стоит в центре свободной области
    function centerOn(mx, my, k) {
      const p = insets();
      const cx = p.l + (cw - p.l - p.r) / 2, cy = p.t + (ch - p.t - p.b) / 2;
      return { k, x: cx - mx * k, y: cy - my * k };
    }

    function measure() {
      const rect = mapWrap.getBoundingClientRect();
      cw = rect.width;
      ch = rect.height;
      svg.setAttribute("viewBox", `0 0 ${cw} ${ch}`);
      // Canvas в полном разрешении экрана (на Retina — вдвое больше пикселей)
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(cw * dpr);
      canvas.height = Math.round(ch * dpr);
      canvas.style.width = cw + "px";
      canvas.style.height = ch + "px";
      dirty = true;
      const p = insets();
      homeK = Math.min((cw - p.l - p.r) / W, (ch - p.t - p.b) / H);
    }

    // Масштаб точек: мягко растут при приближении, на узком экране — мельче.
    // Подписи от него не зависят: их размер на экране всегда одинаковый.
    function dotScale(k) {
      return clamp(Math.pow(k / homeK, 0.33), 0.85, 2.3) * clamp(cw / 1200, 0.55, 1);
    }

    function clampK(k) { return clamp(k, homeK * 0.6, homeK * 60); }

    // Применяем текущий вид к SVG
    function apply() {
      const { k, x, y } = view;
      viewport.setAttribute("transform", `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${k.toFixed(5)})`);
      hatch.setAttribute("patternTransform", `scale(${(1 / k).toFixed(5)}) rotate(45)`);
      dirty = true;
      scheduleLabels();
    }

    function stopAnim() {
      if (anim) cancelAnimationFrame(anim);
      anim = null;
    }

    // Плавный «перелёт» камеры: сначала отдаляемся, потом приближаемся (алгоритм ван Вейка)
    function flyTo(target, duration) {
      stopAnim();
      if (reduceMotion) { view = target; apply(); return; }

      const rho = Math.SQRT2;
      const c0 = [(cw / 2 - view.x) / view.k, (ch / 2 - view.y) / view.k, cw / view.k];
      const c1 = [(cw / 2 - target.x) / target.k, (ch / 2 - target.y) / target.k, cw / target.k];
      const dx = c1[0] - c0[0], dy = c1[1] - c0[1], d2 = dx * dx + dy * dy;
      let S, interp;

      if (d2 < 1e-9) {
        S = Math.log(c1[2] / c0[2]) / rho;
        interp = (t) => [c0[0] + t * dx, c0[1] + t * dy, c0[2] * Math.exp(rho * t * S)];
      } else {
        const d1 = Math.sqrt(d2);
        const b0 = (c1[2] ** 2 - c0[2] ** 2 + rho ** 4 * d2) / (2 * c0[2] * rho ** 2 * d1);
        const b1 = (c1[2] ** 2 - c0[2] ** 2 - rho ** 4 * d2) / (2 * c1[2] * rho ** 2 * d1);
        const r0 = Math.log(Math.sqrt(b0 * b0 + 1) - b0);
        const r1 = Math.log(Math.sqrt(b1 * b1 + 1) - b1);
        S = (r1 - r0) / rho;
        interp = (t) => {
          const s = t * S, coshr0 = Math.cosh(r0);
          const u = c0[2] / (rho ** 2 * d1) * (coshr0 * Math.tanh(rho * s + r0) - Math.sinh(r0));
          return [c0[0] + u * dx, c0[1] + u * dy, c0[2] * coshr0 / Math.cosh(rho * s + r0)];
        };
      }

      const dur = duration || clamp(Math.abs(S) * 650, 450, 1600);
      const t0 = performance.now();
      const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

      const step = (now) => {
        const t = Math.min(1, (now - t0) / dur);
        const [ux, uy, w] = interp(ease(t));
        const k = cw / w;
        view = { k, x: cw / 2 - ux * k, y: ch / 2 - uy * k };
        apply();
        if (t < 1) anim = requestAnimationFrame(step);
        else { view = target; apply(); anim = null; }
      };
      anim = requestAnimationFrame(step);
    }

    // Масштабирование относительно точки экрана (под курсором или пальцами)
    function zoomAround(px, py, k2) {
      k2 = clampK(k2);
      const mx = (px - view.x) / view.k, my = (py - view.y) / view.k;
      view = { k: k2, x: px - mx * k2, y: py - my * k2 };
      apply();
    }

    function localPoint(e) {
      const rect = svg.getBoundingClientRect();
      return [e.clientX - rect.left, e.clientY - rect.top];
    }

    // Колесо мыши и жест «щипок» на тачпаде
    svg.addEventListener("wheel", (e) => {
      e.preventDefault();
      stopAnim();
      const [px, py] = localPoint(e);
      const unit = e.deltaMode === 1 ? 0.05 : e.deltaMode === 2 ? 1 : (e.ctrlKey ? 0.01 : 0.002);
      zoomAround(px, py, view.k * Math.pow(2, -e.deltaY * unit));
    }, { passive: false });

    // Перетаскивание мышью и пальцами, щипок двумя пальцами
    const pointers = new Map();
    let gesture = null;
    let moved = false;

    function startGesture() {
      const pts = [...pointers.values()];
      gesture = { k: view.k, x: view.x, y: view.y, p: pts[0] };
      if (pts.length >= 2) {
        const [a, b] = pts;
        gesture.mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
        gesture.dist = Math.hypot(a[0] - b[0], a[1] - b[1]) || 1;
      }
    }

    svg.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      stopAnim();
      if (!pointers.size) moved = false;
      pointers.set(e.pointerId, localPoint(e));
      startGesture();
    });

    window.addEventListener("pointermove", (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, localPoint(e));
      const pts = [...pointers.values()];

      if (pts.length === 1) {
        const dx = pts[0][0] - gesture.p[0], dy = pts[0][1] - gesture.p[1];
        if (!moved && Math.hypot(dx, dy) < 5) return;   // это ещё клик, а не перетаскивание
        moved = true;
        svg.classList.add("dragging");
        hideTooltip();
        view = { k: gesture.k, x: gesture.x + dx, y: gesture.y + dy };
        apply();
      } else {
        moved = true;
        const [a, b] = pts;
        const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
        const k2 = clampK(gesture.k * Math.hypot(a[0] - b[0], a[1] - b[1]) / gesture.dist);
        const mx = (gesture.mid[0] - gesture.x) / gesture.k, my = (gesture.mid[1] - gesture.y) / gesture.k;
        view = { k: k2, x: mid[0] - mx * k2, y: mid[1] - my * k2 };
        apply();
      }
    });

    function endPointer(e) {
      if (!pointers.delete(e.pointerId)) return;
      if (pointers.size) startGesture();
      else svg.classList.remove("dragging");
    }
    window.addEventListener("pointerup", endPointer);
    window.addEventListener("pointercancel", endPointer);

    // Кнопки масштаба
    function zoomBy(f) { flyTo(centerAround(clampK(view.k * f)), 450); }
    function centerAround(k2) {
      const p = insets();
      const cx = p.l + (cw - p.l - p.r) / 2, cy = p.t + (ch - p.t - p.b) / 2;
      return centerOn((cx - view.x) / view.k, (cy - view.y) / view.k, k2);
    }

    $("#zoomIn").addEventListener("click", () => zoomBy(2));
    $("#zoomOut").addEventListener("click", () => zoomBy(0.5));
    $("#homeBtn").addEventListener("click", () => goHome());
    $("#logo").addEventListener("click", () => goHome());

    /* =========================================================
       ПОДПИСИ ГОРОДОВ: показываем, только если не налезают друг на друга
       ========================================================= */
    let labelsOn = true;
    let labelTimer = null;
    let minPop = 0;
    let selectedCity = null;
    let labelsReady = false;          // подписи включаются после «зажигания» городов
    let labeledList = [];

    function scheduleLabels() {
      clearTimeout(labelTimer);
      labelTimer = setTimeout(updateLabels, 70);
    }

    function updateLabels() {
      if (!labelsReady) return;
      const { k, x, y } = view;
      const g = dotScale(k);
      const p = insets();
      const right = cw - (isMobile() ? 0 : p.r - 20), bottom = ch - (isMobile() ? p.b - 16 : 0);
      const limit = isMobile() ? 28 : 70;
      const boxes = [];
      let count = 0;

      const tryPlace = (c) => {
        const sx = c.x * k + x, sy = c.y * k + y;
        if (sx < 0 || sy < 0 || sx > right || sy > bottom) return false;
        const big = c.pop >= 1e6;
        const w = c.name.length * (big ? 8.8 : 7.4) + 6, h = big ? 18 : 16;
        const r = c.r * g;
        const box = [sx + r + 2, sy - h / 2, sx + r + 2 + w, sy + h / 2];
        if (box[2] > right) return false;
        for (const b of boxes) if (box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1]) return false;
        boxes.push(box, [sx - r, sy - r, sx + r, sy + r]);
        return true;
      };

      const show = new Set();
      if (selectedCity && tryPlace(selectedCity)) show.add(selectedCity);
      if (labelsOn) {
        for (const c of CITIES) {
          if (count >= limit) break;
          if (c.pop < minPop || c === selectedCity) continue;
          if (tryPlace(c)) { show.add(c); count++; }
        }
      }

      // Запоминаем момент появления подписи — для плавного проявления
      const now = performance.now();
      for (const c of CITIES) {
        const on = show.has(c);
        if (on && !c.labeled) c.labelT = now;
        c.labeled = on;
      }
      labeledList = CITIES.filter((c) => c.labeled);
      dirty = true;
    }

    $("#labelsBtn").addEventListener("click", (e) => {
      labelsOn = !labelsOn;
      e.currentTarget.setAttribute("aria-pressed", String(labelsOn));
      updateLabels();
    });

    /* =========================================================
       ФИЛЬТР ПО НАСЕЛЕНИЮ
       ========================================================= */
    const filtersCount = $("#filtersCount");

    function applyFilter(min) {
      minPop = min;
      let n = 0;
      CITIES.forEach((c) => { if (c.pop >= min) n++; });
      dirty = true;
      filtersCount.textContent = fmt(n) + " " + plural(n, ["город", "города", "городов"]);
      document.querySelectorAll("#filters [data-min]").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.min === min)));
      updateLabels();
    }

    document.querySelectorAll("#filters [data-min]").forEach((b) => {
      b.addEventListener("click", () => applyFilter(+b.dataset.min));
    });

    /* =========================================================
       ПОДСКАЗКА ПРИ НАВЕДЕНИИ
       ========================================================= */
    const tooltip = $("#tooltip");
    const regionChip = $("#regionChip");
    let hoverRegion = null;

    function showTooltip(c, e) {
      tooltip.innerHTML =
        `<div class="tooltip-name">${escapeHtml(c.name)}</div>` +
        `<div class="tooltip-meta">${escapeHtml(c.region.name)}</div>` +
        `<div class="tooltip-pop">${fmt(c.pop)} жит.</div>`;
      tooltip.classList.add("show");
      moveTooltip(e);
    }

    function moveTooltip(e) {
      const [px, py] = localPoint(e);
      const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
      const tx = px + 18 + tw > cw ? px - tw - 18 : px + 18;
      const ty = clamp(py - th - 14, 8, ch - th - 8);
      tooltip.style.setProperty("--tx", tx + "px");
      tooltip.style.setProperty("--ty", ty + "px");
    }

    function hideTooltip() { tooltip.classList.remove("show"); }

    // Ближайший к точке экрана город (или null). slop — запас для пальца
    function cityAt(px, py, slop) {
      const { k, x, y } = view;
      const g = dotScale(k);
      let best = null, bestD = Infinity;
      for (const c of CITIES) {
        if (c.pop < minPop) continue;
        const dx = c.x * k + x - px, dy = c.y * k + y - py;
        const d = dx * dx + dy * dy;
        const rr = Math.max(c.r * g + 3, slop);
        if (d < rr * rr && d < bestD) { bestD = d; best = c; }
      }
      return best;
    }

    let hoverCity = null;

    svg.addEventListener("pointermove", (e) => {
      if (e.pointerType !== "mouse" || pointers.size) return;
      const [px, py] = localPoint(e);
      const c = cityAt(px, py, 7);
      if (c !== hoverCity) {
        hoverCity = c;
        dirty = true;
        svg.style.cursor = c ? "pointer" : "";
      }
      if (c) showTooltip(c, e); else hideTooltip();
    });

    svg.addEventListener("pointerleave", () => {
      hoverCity = null;
      dirty = true;
      hideTooltip();
      regionChip.classList.remove("show");
      hoverRegion = null;
    });

    // Название региона под курсором
    svg.addEventListener("pointerover", (e) => {
      if (e.pointerType !== "mouse") return;
      const regionEl = e.target.closest(".region");
      if (!regionEl) { regionChip.classList.remove("show"); hoverRegion = null; return; }
      const r = REGIONS[+regionEl.dataset.r];
      if (r !== hoverRegion) {
        hoverRegion = r;
        regionChip.innerHTML = escapeHtml(r.name) + `<small>${r.cities.length} ${plural(r.cities.length, ["город", "города", "городов"])}</small>`;
      }
      regionChip.classList.add("show");
    });

    // Клик по городу или региону (если это не было перетаскивание)
    let lastPointerType = "mouse";
    svg.addEventListener("pointerdown", (e) => { lastPointerType = e.pointerType; });
    svg.addEventListener("click", (e) => {
      if (moved) return;
      const [px, py] = localPoint(e);
      const c = cityAt(px, py, lastPointerType === "mouse" ? 7 : 16);
      if (c) { showCity(c); return; }
      const regionEl = e.target.closest(".region");
      if (regionEl) showRegion(REGIONS[+regionEl.dataset.r]);
    });

    /* =========================================================
       ОТРИСОВКА ГОРОДОВ НА CANVAS
       ========================================================= */
    const introStart = performance.now();
    const TAU = Math.PI * 2;
    let focusSet = null;              // регионы в фокусе (остальные города приглушены)
    let palette = {};

    // Цвета берём из CSS-переменных текущей темы
    function readPalette() {
      const cs = getComputedStyle(document.documentElement);
      const v = (name) => cs.getPropertyValue(name).trim();
      palette = { dot: v("--dot"), halo: v("--dot-halo"), accent: v("--accent"), label: v("--label"), labelHalo: v("--label-halo") };
      dirty = true;
    }

    // Пружинное появление точки: 0 → чуть больше 1 → 1
    function popScale(t) {
      if (t <= 0) return 0;
      if (t >= 1) return 1;
      const c1 = 2.4, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    function render(now) {
      requestAnimationFrame(render);
      const elapsed = now - introStart;
      const intro = elapsed < 3300;
      // Без движения перерисовываем только при изменениях; иначе — пульсация каждый кадр
      if (!dirty && !intro && (reduceMotion || !selectedCity && !pulsesVisible)) return;
      dirty = false;

      const { k, x, y } = view;
      const g = dotScale(k);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cw, ch);
      pulsesVisible = false;

      for (const c of DRAW_ORDER) {
        // Плавное скрытие фильтром и приглушение вне фокуса
        const target = c.pop < minPop ? 0 : focusSet && !focusSet.has(c.region) ? 0.22 : 1;
        if (c.alpha !== target) {
          c.alpha += (target - c.alpha) * 0.2;
          if (Math.abs(target - c.alpha) < 0.01) c.alpha = target;
          dirty = true;
        }
        if (c.alpha <= 0.01) continue;

        const sx = c.x * k + x, sy = c.y * k + y;
        if (sx < -40 || sy < -40 || sx > cw + 40 || sy > ch + 40) continue;

        const t = (elapsed - c.delay) / 700;
        const s = popScale(t);
        if (s <= 0) continue;
        const base = c.r * g;
        ctx.globalAlpha = c.alpha;

        // Мягкое свечение вокруг крупных городов
        if (c.pop >= 1e5) {
          ctx.fillStyle = palette.halo;
          ctx.beginPath();
          ctx.arc(sx, sy, base * 2.6 * Math.min(1, t), 0, TAU);
          ctx.fill();
        }

        // Расходящиеся волны у городов-миллионников
        if (c.pop >= 1e6 && !reduceMotion && t > 1) {
          pulsesVisible = true;
          const ph = ((elapsed - c.delay - 700) % 3000) / 3000;
          ctx.globalAlpha = c.alpha * 0.8 * (1 - ph);
          ctx.strokeStyle = palette.dot;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(sx, sy, base * (1 + 3.5 * ph), 0, TAU);
          ctx.stroke();
          ctx.globalAlpha = c.alpha;
        }

        const active = c === hoverCity || c === selectedCity;
        ctx.fillStyle = active ? palette.accent : palette.dot;
        ctx.beginPath();
        ctx.arc(sx, sy, base * s * (c === hoverCity ? 1.7 : c === selectedCity ? 1.5 : 1), 0, TAU);
        ctx.fill();
      }

      // Кольца вокруг выбранного города
      if (selectedCity) {
        const sx = selectedCity.x * k + x, sy = selectedCity.y * k + y;
        ctx.strokeStyle = palette.accent;
        ctx.lineWidth = 2;
        const rings = reduceMotion ? [0.5] : [(now % 2000) / 2000, ((now + 1000) % 2000) / 2000];
        for (const ph of rings) {
          ctx.globalAlpha = 1 - ph;
          ctx.beginPath();
          ctx.arc(sx, sy, (selectedCity.r * g + 4) * (1 + 2 * ph), 0, TAU);
          ctx.stroke();
        }
      }

      // Подписи с тёмной «обводкой» для читаемости
      ctx.textBaseline = "middle";
      ctx.lineJoin = "round";
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = palette.labelHalo;
      ctx.fillStyle = palette.label;
      for (const c of labeledList) {
        const fade = Math.min(1, (now - c.labelT) / 350);
        if (fade < 1) dirty = true;
        ctx.globalAlpha = fade * c.alpha;
        if (ctx.globalAlpha <= 0.01) continue;
        ctx.font = c.pop >= 1e6 ? "800 14.5px Manrope, Inter, system-ui, sans-serif" : "700 12.5px Manrope, Inter, system-ui, sans-serif";
        const lx = c.x * k + x + c.r * g + 4, ly = c.y * k + y;
        ctx.strokeText(c.name, lx, ly);
        ctx.fillText(c.name, lx, ly);
      }
      ctx.globalAlpha = 1;
    }
    let pulsesVisible = true;

    /* =========================================================
       ВЫДЕЛЕНИЕ НА КАРТЕ
       ========================================================= */
    // Подсветить набор регионов, остальные приглушить (null — снять фокус)
    function setFocus(regions) {
      focusSet = regions ? new Set(regions) : null;
      svg.classList.toggle("focus", !!regions);
      REGIONS.forEach((r) => r.el.classList.toggle("active", !!focusSet && focusSet.has(r)));
      dirty = true;
    }

    function selectCityMark(c) {
      REGIONS.forEach((r) => r.el.classList.remove("hl"));
      selectedCity = c;
      if (c) c.region.el.classList.add("hl");
      dirty = true;
      updateLabels();
    }

    /* =========================================================
       ПАНЕЛЬ: главная, город, регион, округ
       ========================================================= */
    const panelBody = $("#panelBody");
    const navStack = [];              // стек экранов для кнопки «Назад»
    let current = { type: "home" };
    let clockTimer = null;

    function setPanel(html, state, push) {
      if (push && (current.type !== state.type || current.item !== state.item)) navStack.push(current);
      current = state;
      clearInterval(clockTimer);
      panelBody.classList.remove("swap");
      void panelBody.offsetWidth;     // перезапуск анимации появления
      panelBody.innerHTML = html;
      panelBody.classList.add("swap");
      panelBody.scrollTop = 0;
      countUp(panelBody);
      if (isMobile() && state.type !== "home") panel.classList.remove("collapsed");
    }

    function backButton() {
      return navStack.length ? `<button class="back" type="button" data-back>← Назад</button>` : "";
    }

    function cityRow(c, n, max, meta) {
      const w = max ? Math.max(4, (c.pop / max) * 100) : 0;
      return `<li><button class="row" type="button" data-city="${c.i}" style="--n:${n}">` +
        (max ? `<span class="row-bar" style="--w:${w.toFixed(1)}%"></span>` : "") +
        `<span class="row-rank">${n + 1}</span>` +
        `<span class="row-main"><span class="row-name">${escapeHtml(c.name)}</span>` +
        `<span class="row-meta">${escapeHtml(meta != null ? meta : c.region.name)}</span></span>` +
        `<span class="row-value">${shortPop(c.pop)}</span></button></li>`;
    }

    // Анимированный счётчик чисел
    function countUp(root) {
      root.querySelectorAll("[data-count]").forEach((el) => {
        const target = +el.dataset.count;
        const mode = el.dataset.mode;
        const show = (v) => { el.textContent = mode === "mln" ? (v / 1e6).toLocaleString("ru-RU", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " млн" : fmt(v); };
        if (reduceMotion) { show(target); return; }
        const t0 = performance.now(), dur = 1200;
        const step = (now) => {
          const t = Math.min(1, (now - t0) / dur);
          show(target * (1 - Math.pow(1 - t, 3)));
          if (t < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
    }

    // --- Главный экран ---
    function renderHome(push) {
      const total = sum(CITIES, "pop");
      const millions = CITIES.filter((c) => c.pop >= 1e6).length;
      const max = CITIES[0].pop;
      const oldest = CITIES.filter((c) => c.year != null).sort((a, b) => a.year - b.year).slice(0, 5);
      const pick = (fn) => CITIES.reduce((best, c) => (fn(c) > fn(best) ? c : best));
      const records = [
        ["Самый северный", pick((c) => c.lat), (c) => c.lat.toFixed(1) + "° с. ш."],
        ["Самый южный", pick((c) => -c.lat), (c) => c.lat.toFixed(1) + "° с. ш."],
        ["Самый западный", pick((c) => -c.lon), (c) => c.lon.toFixed(1) + "° в. д."],
        ["Самый восточный", pick((c) => c.lon), (c) => c.lon.toFixed(1) + "° в. д."]
      ];

      setPanel(
        `<div><div class="eyebrow">Атлас</div>
          <h1 class="title">Города России</h1>
          <p class="subtitle">Каждая светящаяся точка — город. Наведите, нажмите или найдите нужный в поиске.</p></div>
        <div class="stats">
          <div class="stat"><div class="stat-label">Городов</div><div class="stat-value" data-count="${CITIES.length}">0</div></div>
          <div class="stat"><div class="stat-label">Живут в них</div><div class="stat-value" data-count="${total}" data-mode="mln">0</div></div>
          <div class="stat"><div class="stat-label">Миллионников</div><div class="stat-value" data-count="${millions}">0</div></div>
          <div class="stat"><div class="stat-label">Часовых поясов</div><div class="stat-value" data-count="${new Set(CITIES.map((c) => c.tz)).size}">0</div></div>
        </div>
        <div><h2 class="section-title">Крупнейшие города</h2>
          <ul class="list">${CITIES.slice(0, 10).map((c, n) => cityRow(c, n, max)).join("")}</ul></div>
        <div><h2 class="section-title">Древнейшие</h2>
          <ul class="list">${oldest.map((c, n) => cityRow(c, n, 0, "основан в " + yearText(c.year))).join("")}</ul></div>
        <div><h2 class="section-title">Рекорды</h2>
          <ul class="list">${records.map(([title, c, val], n) =>
            `<li><button class="row" type="button" data-city="${c.i}"><span class="row-main"><span class="row-name">${escapeHtml(c.name)}</span><span class="row-meta">${title}</span></span><span class="row-value">${val(c)}</span></button></li>`).join("")}</ul></div>
        <div><h2 class="section-title">Федеральные округа</h2>
          <ul class="list">${DISTRICTS.map((d) =>
            `<li><button class="row" type="button" data-district="${d.i}"><span class="swatch" style="--c:${d.color}"></span><span class="row-main"><span class="row-name">${escapeHtml(d.name)}</span><span class="row-meta">${d.regions.length} ${plural(d.regions.length, ["регион", "региона", "регионов"])}</span></span><span class="row-value">${d.cities.length} ${plural(d.cities.length, ["город", "города", "городов"])}</span></button></li>`).join("")}
            <li><div class="row" style="cursor:default"><span class="swatch hatched"></span><span class="row-main"><span class="row-name">Спорная территория</span><span class="row-meta">Крым и Севастополь</span></span></div></li>
          </ul>
          <p class="hint">Колесо мыши или щипок — масштаб, перетаскивание — перемещение. Клавиши: <b>/</b> — поиск, <b>+</b>/<b>−</b> — масштаб, <b>Esc</b> — назад.</p>
          <p class="credits">Данные о городах — <a href="https://github.com/hflabs/city" target="_blank" rel="noopener">hflabs/city</a> (население — Росстат), границы — <a href="https://www.naturalearthdata.com" target="_blank" rel="noopener">Natural Earth</a>.</p></div>`,
        { type: "home" }, push
      );
    }

    // --- Экран города ---
    function renderCity(c, push) {
      const r = c.region;
      const district = ATLAS.districts[r.fd];
      const now = new Date().getFullYear();
      const userTz = -new Date().getTimezoneOffset() / 60;
      const diff = c.tz - userTz;
      const diffText = diff === 0 ? "как у вас" : `на ${Math.abs(diff)} ч ${diff > 0 ? "впереди" : "позади"} вас`;
      const nearest = CITIES.filter((o) => o !== c).map((o) => ({ o, d: distanceKm(c, o) })).sort((a, b) => a.d - b.d).slice(0, 5);
      const badges = [];
      if (c.rank === 1) badges.push(`<span class="badge accent">Столица России</span>`);
      else if (c.capital) badges.push(`<span class="badge accent">Административный центр</span>`);
      if (c.pop >= 1e6) badges.push(`<span class="badge">Город-миллионник</span>`);
      if (r.disputed) badges.push(`<span class="badge warn">Спорная территория</span>`);

      setPanel(
        `<div>${backButton()}<div class="eyebrow">Город · №${c.rank} по населению</div>
          <h1 class="title">${escapeHtml(c.name)}</h1>
          <p class="subtitle">${escapeHtml(r.name)}${r.disputed ? "" : " · " + escapeHtml(district) + " ФО"}</p>
          ${badges.length ? `<div class="badges">${badges.join("")}</div>` : ""}</div>
        <div class="stats">
          <div class="stat"><div class="stat-label">Население</div><div class="stat-value" data-count="${c.pop}">0</div><div class="stat-note">${(c.pop / sum(CITIES, "pop") * 100).toLocaleString("ru-RU", { maximumFractionDigits: 2 })}% горожан</div></div>
          <div class="stat"><div class="stat-label">Основан</div><div class="stat-value">${c.year != null ? yearText(c.year) : "—"}</div><div class="stat-note">${c.year != null ? fmt(now - c.year) + " " + plural(now - c.year, ["год", "года", "лет"]) : "нет данных"}</div></div>
          <div class="stat"><div class="stat-label">Местное время</div><div class="stat-value" id="cityClock">--:--</div><div class="stat-note">UTC+${c.tz}, ${diffText}</div></div>
          <div class="stat"><div class="stat-label">Координаты</div><div class="stat-value" style="font-size:17px">${c.lat.toFixed(2)}°, ${c.lon.toFixed(2)}°</div><div class="stat-note">с. ш., в. д.</div></div>
        </div>
        <div><h2 class="section-title">Ближайшие города</h2>
          <ul class="list">${nearest.map(({ o, d }, n) =>
            `<li><button class="row" type="button" data-city="${o.i}"><span class="row-rank">${n + 1}</span><span class="row-main"><span class="row-name">${escapeHtml(o.name)}</span><span class="row-meta">${shortPop(o.pop)} жит.</span></span><span class="row-value">${fmt(d)} км</span></button></li>`).join("")}</ul></div>
        <div><button class="row" type="button" data-region="${r.i}"><span class="swatch${r.disputed ? " hatched" : ""}" style="--c:${COLORS[r.fd]}"></span><span class="row-main"><span class="row-name">${escapeHtml(r.name)}</span><span class="row-meta">Все ${r.cities.length} ${plural(r.cities.length, ["город", "города", "городов"])} региона</span></span><span class="row-value">→</span></button>
          <div class="links">
            <a class="btn" href="https://ru.wikipedia.org/w/index.php?search=${encodeURIComponent(c.name)}&title=Служебная:Поиск&go=Перейти" target="_blank" rel="noopener">Википедия</a>
            <a class="btn" href="https://www.openstreetmap.org/?mlat=${c.lat}&mlon=${c.lon}#map=12/${c.lat}/${c.lon}" target="_blank" rel="noopener">OpenStreetMap</a>
          </div></div>`,
        { type: "city", item: c }, push
      );

      // Живые часы с мигающим двоеточием
      const clock = $("#cityClock");
      const tick = () => {
        const d = new Date(Date.now() + c.tz * 3600e3);
        clock.innerHTML = String(d.getUTCHours()).padStart(2, "0") + '<span class="colon">:</span>' + String(d.getUTCMinutes()).padStart(2, "0");
      };
      tick();
      clockTimer = setInterval(tick, 5000);
    }

    // --- Экран региона ---
    function renderRegion(r, push) {
      const max = r.cities[0] ? r.cities[0].pop : 1;
      setPanel(
        `<div>${backButton()}<div class="eyebrow">${r.disputed ? "Спорная территория" : escapeHtml(ATLAS.districts[r.fd]) + " федеральный округ"}</div>
          <h1 class="title">${escapeHtml(r.name)}</h1></div>
        <div class="stats">
          <div class="stat"><div class="stat-label">Городов</div><div class="stat-value" data-count="${r.cities.length}">0</div></div>
          <div class="stat"><div class="stat-label">Горожан</div><div class="stat-value" data-count="${r.pop}">0</div></div>
        </div>
        ${r.disputed ? `<div class="note">Статус территории оспаривается: присоединение Крыма к России в 2014 году не признано большинством государств — членов ООН.</div>` : ""}
        <div><h2 class="section-title">Города региона</h2>
          <ul class="list">${r.cities.map((c, n) => cityRow(c, n, max, c === r.cities[0] ? "крупнейший" : "")).join("")}</ul></div>`,
        { type: "region", item: r }, push
      );
    }

    // --- Экран федерального округа ---
    function renderDistrict(d, push) {
      const max = d.cities[0].pop;
      const regions = d.regions.slice().sort((a, b) => b.pop - a.pop);
      setPanel(
        `<div>${backButton()}<div class="eyebrow">Федеральный округ</div>
          <h1 class="title">${escapeHtml(d.name)}</h1></div>
        <div class="stats">
          <div class="stat"><div class="stat-label">Городов</div><div class="stat-value" data-count="${d.cities.length}">0</div></div>
          <div class="stat"><div class="stat-label">Горожан</div><div class="stat-value" data-count="${d.pop}" data-mode="mln">0</div></div>
        </div>
        <div><h2 class="section-title">Крупнейшие города</h2>
          <ul class="list">${d.cities.slice(0, 10).map((c, n) => cityRow(c, n, max)).join("")}</ul></div>
        <div><h2 class="section-title">Регионы</h2>
          <ul class="list">${regions.map((r) =>
            `<li><button class="row" type="button" data-region="${r.i}"><span class="swatch" style="--c:${d.color}"></span><span class="row-main"><span class="row-name">${escapeHtml(r.name)}</span><span class="row-meta">${shortPop(r.pop)} горожан</span></span><span class="row-value">${r.cities.length}</span></button></li>`).join("")}</ul></div>`,
        { type: "district", item: d }, push
      );
    }

    // Клики внутри панели (делегирование)
    panelBody.addEventListener("click", (e) => {
      const t = e.target.closest("[data-city], [data-region], [data-district], [data-back]");
      if (!t) return;
      if (t.hasAttribute("data-back")) goBack();
      else if (t.dataset.city) showCity(CITIES[+t.dataset.city]);
      else if (t.dataset.region) showRegion(REGIONS[+t.dataset.region]);
      else if (t.dataset.district) showDistrict(DISTRICTS[+t.dataset.district]);
    });

    /* =========================================================
       НАВИГАЦИЯ
       ========================================================= */
    function setHash(text) {
      try { window.history.replaceState(null, "", text ? "#" + encodeURIComponent(text) : location.pathname + location.search); } catch (e) { /* file:// в некоторых браузерах */ }
    }

    function showCity(c, push = true) {
      setFocus(null);
      selectCityMark(c);
      renderCity(c, push);
      flyTo(centerOn(c.x, c.y, Math.max(view.k, homeK * 7)));
      setHash(c.name);
    }

    function showRegion(r, push = true) {
      selectCityMark(null);
      setFocus([r]);
      renderRegion(r, push);
      flyTo(fitBox(r.bbox, homeK * 25));
      setHash(r.name);
    }

    function showDistrict(d, push = true) {
      selectCityMark(null);
      setFocus(d.regions);
      renderDistrict(d, push);
      flyTo(fitBox(d.bbox));
      setHash("");
    }

    function goHome() {
      navStack.length = 0;
      selectCityMark(null);
      setFocus(null);
      renderHome(false);
      flyTo(fitBox([0, 0, W, H]));
      setHash("");
    }

    function goBack() {
      const prev = navStack.pop();
      if (!prev || prev.type === "home") { goHome(); return; }
      if (prev.type === "city") showCity(prev.item, false);
      if (prev.type === "region") showRegion(prev.item, false);
      if (prev.type === "district") showDistrict(prev.item, false);
    }

    // Случайный город среди показанных фильтром
    $("#randomBtn").addEventListener("click", () => {
      const pool = CITIES.filter((c) => c.pop >= minPop && c !== selectedCity);
      showCity(pool[Math.floor(Math.random() * pool.length)]);
    });

    // Шторка на телефоне
    $("#sheetHandle").addEventListener("click", () => {
      panel.classList.toggle("collapsed");
      scheduleLabels();
    });

    /* =========================================================
       ПОИСК
       ========================================================= */
    const searchInput = $("#searchInput");
    const searchBox = $("#searchBox");
    const results = $("#results");
    let found = [];
    let activeIdx = -1;

    function highlight(name, q) {
      const i = normalize(name).indexOf(q);
      if (i < 0 || !q) return escapeHtml(name);
      return escapeHtml(name.slice(0, i)) + "<mark>" + escapeHtml(name.slice(i, i + q.length)) + "</mark>" + escapeHtml(name.slice(i + q.length));
    }

    function runSearch() {
      const q = normalize(searchInput.value);
      if (!q) { closeResults(); return; }
      const starts = CITIES.filter((c) => c.key.startsWith(q));
      const contains = CITIES.filter((c) => !c.key.startsWith(q) && c.key.includes(q));
      const regions = REGIONS.filter((r) => r.key.includes(q)).slice(0, 3);
      found = [...starts, ...contains].slice(0, 8).map((c) => ({ type: "city", item: c }))
        .concat(regions.map((r) => ({ type: "region", item: r })));
      activeIdx = found.length ? 0 : -1;

      results.innerHTML = found.length
        ? found.map((f, n) => {
            const it = f.item;
            const meta = f.type === "city" ? `${escapeHtml(it.region.name)} · ${shortPop(it.pop)}` : `регион · ${it.cities.length} ${plural(it.cities.length, ["город", "города", "городов"])}`;
            const color = f.type === "city" ? "" : `style="--c:${COLORS[it.fd]}"`;
            return `<li class="result" role="option" id="opt-${n}" data-n="${n}" aria-selected="${n === activeIdx}">` +
              `<span class="result-dot" ${color}></span><span class="result-main"><div class="result-name">${highlight(it.name, q)}</div><div class="result-meta">${meta}</div></span></li>`;
          }).join("")
        : `<li class="result-empty">Ничего не найдено</li>`;

      results.classList.add("open");
      searchBox.setAttribute("aria-expanded", "true");
      searchInput.setAttribute("aria-activedescendant", activeIdx >= 0 ? "opt-0" : "");
    }

    function closeResults() {
      results.classList.remove("open");
      searchBox.setAttribute("aria-expanded", "false");
    }

    function choose(n) {
      const f = found[n];
      if (!f) return;
      closeResults();
      searchInput.value = "";
      searchInput.blur();
      if (f.type === "city") showCity(f.item); else showRegion(f.item);
    }

    function setActive(n) {
      activeIdx = (n + found.length) % found.length;
      results.querySelectorAll(".result").forEach((el, i) => el.setAttribute("aria-selected", String(i === activeIdx)));
      const el = $("#opt-" + activeIdx);
      if (el) { el.scrollIntoView({ block: "nearest" }); searchInput.setAttribute("aria-activedescendant", el.id); }
    }

    searchInput.addEventListener("input", runSearch);
    searchInput.addEventListener("focus", () => { if (searchInput.value) runSearch(); });
    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown" && found.length) { e.preventDefault(); setActive(activeIdx + 1); }
      else if (e.key === "ArrowUp" && found.length) { e.preventDefault(); setActive(activeIdx - 1); }
      else if (e.key === "Enter") { e.preventDefault(); choose(activeIdx); }
      else if (e.key === "Escape") { closeResults(); searchInput.blur(); }
    });
    results.addEventListener("pointerdown", (e) => e.preventDefault());   // не теряем фокус до клика
    results.addEventListener("click", (e) => {
      const li = e.target.closest(".result");
      if (li) choose(+li.dataset.n);
    });
    searchInput.addEventListener("blur", () => setTimeout(closeResults, 120));

    /* =========================================================
       КЛАВИАТУРА
       ========================================================= */
    document.addEventListener("keydown", (e) => {
      if (e.target === searchInput) return;
      if (e.key === "/") { e.preventDefault(); searchInput.focus(); }
      else if (e.key === "+" || e.key === "=") zoomBy(2);
      else if (e.key === "-" || e.key === "_") zoomBy(0.5);
      else if (e.key === "0") goHome();
      else if (e.key === "Escape" && current.type !== "home") goBack();
    });

    /* =========================================================
       ТЕМА
       ========================================================= */
    const THEME_KEY = "lumen-atlas-theme";
    function applyTheme(t) {
      document.documentElement.setAttribute("data-theme", t);
      $("#themeIcon").textContent = t === "dark" ? "☀️" : "🌙";
      readPalette();
    }
    const savedTheme = storageGet(THEME_KEY);
    applyTheme(savedTheme === "light" || savedTheme === "dark" ? savedTheme : "dark");
    $("#themeBtn").addEventListener("click", () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      applyTheme(next);
      storageSet(THEME_KEY, next);
    });

    /* =========================================================
       ИЗМЕНЕНИЕ РАЗМЕРА ОКНА
       ========================================================= */
    let lastMobile = isMobile();
    new ResizeObserver(() => {
      const oldK = homeK;
      const oldCenter = [(cw / 2 - view.x) / view.k, (ch / 2 - view.y) / view.k];
      measure();
      if (isMobile() !== lastMobile || !oldK) { lastMobile = isMobile(); view = fitBox([0, 0, W, H]); }
      else {
        // Сохраняем центр и относительный масштаб
        const k = view.k * (homeK / oldK);
        view = { k, x: cw / 2 - oldCenter[0] * k, y: ch / 2 - oldCenter[1] * k };
      }
      apply();
    }).observe(mapWrap);

    /* =========================================================
       СТАРТ
       ========================================================= */
    if (isMobile()) panel.classList.add("collapsed");   // на телефоне карта — главное
    measure();
    const home = fitBox([0, 0, W, H]);
    view = centerOn(W / 2, H / 2, home.k * 0.82);     // старт чуть издалека
    apply();
    renderHome(false);
    applyFilter(0);
    flyTo(home, 2200);

    requestAnimationFrame(render);
    // Шрифт мог догрузиться позже — перерисуем подписи
    if (document.fonts) document.fonts.ready.then(() => { dirty = true; });

    // Подписи появляются, когда города «зажглись»
    setTimeout(() => {
      labelsReady = true;
      updateLabels();
      // Открываем город или регион из адреса страницы, например …/russia-map.html#Казань
      const target = decodeURIComponent(location.hash.slice(1));
      if (target) {
        const key = normalize(target);
        const c = CITIES.find((x) => x.key === key);
        const r = REGIONS.find((x) => x.key === key);
        if (c) showCity(c); else if (r) showRegion(r);
      }
    }, reduceMotion ? 0 : 2300);
  </script>
</body>
</html>

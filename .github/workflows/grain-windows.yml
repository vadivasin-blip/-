name: Grain — сборка для Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'grain/**'
      - '.github/workflows/grain-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: grain
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: grain/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist:win
      - id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # постоянные имена — чтобы ссылка /releases/latest/download/… не менялась между версиями
      - run: |
          cp "release/Grain-Setup-${{ steps.ver.outputs.v }}.exe" release/Grain-Setup.exe
          cp "release/Grain-${{ steps.ver.outputs.v }}-portable.exe" release/Grain-portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Grain-Windows
          path: grain/release/Grain-Setup.exe
          if-no-files-found: error
      # описание релиза — раздел этой версии из CHANGELOG.md (нет раздела — сборка падает, чтобы версия не вышла без описания)
      - run: node scripts/release-notes.cjs "${{ steps.ver.outputs.v }}" > release/notes.md
      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: grain-v${{ steps.ver.outputs.v }}
          name: Grain ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: grain/release/notes.md
          files: |
            grain/release/Grain-Setup.exe
            grain/release/Grain-portable.exe
      # описания всех вышедших версий — из CHANGELOG.md (правка старого раздела тоже попадёт на GitHub)
      - name: Описания всех релизов
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for v in $(node scripts/release-notes.cjs --list); do
            if gh release view "grain-v$v" >/dev/null 2>&1; then
              node scripts/release-notes.cjs "$v" > "release/notes-$v.md"
              gh release edit "grain-v$v" --notes-file "release/notes-$v.md"
              echo "обновлено grain-v$v"
            fi
          done
